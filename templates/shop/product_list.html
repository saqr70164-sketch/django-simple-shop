{% extends 'shop/base.html' %}
{% block content %}
<h1 class="mb-4">المنتجات</h1>
<div class="row">
  {% for p in products %}
  <div class="col-md-4 mb-3">
    <div class="card h-100">
      {% if p.image %}
      <img src="{{ p.image.url }}" class="card-img-top" style="height:200px;object-fit:cover;" alt="{{ p.name }}">
      {% endif %}
      <div class="card-body d-flex flex-column">
        <h5 class="card-title">{{ p.name }}</h5>
        <p class="card-text">{{ p.description|truncatechars:100 }}</p>
        <div class="mt-auto">
          <p class="fw-bold">{{ p.price }} ر.س</p>
          <a href="{% url 'product_detail' p.pk %}" class="btn btn-sm btn-outline-primary">تفاصيل</a>
          <a href="{% url 'cart_add' p.pk %}" class="btn btn-sm btn-primary">أضف للسلة</a>
        </div>
      </div>
    </div>
  </div>
  {% endfor %}
</div>
{% endblock %}
