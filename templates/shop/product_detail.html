{% extends 'shop/base.html' %}
{% block content %}
<div class="row">
  <div class="col-md-6">
    {% if product.image %}
    <img src="{{ product.image.url }}" class="img-fluid" alt="{{ product.name }}">
    {% endif %}
  </div>
  <div class="col-md-6">
    <h2>{{ product.name }}</h2>
    <p class="lead">{{ product.price }} ر.س</p>
    <p>{{ product.description }}</p>
    <a href="{% url 'cart_add' product.pk %}" class="btn btn-primary">أضف للسلة</a>
  </div>
</div>
{% endblock %}
